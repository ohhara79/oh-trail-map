<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oh-trail-map</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="panel-head">
          <h1>oh&#8209;trail&#8209;map</h1>
          <button id="collapse" type="button" title="Hide panel" aria-label="Hide panel">&laquo;</button>
        </header>

        <div id="panel-body" class="panel-body">
          <section class="block grow-block">
            <div class="row trail-head">
              <input id="trail-all" type="checkbox" title="Show or hide every trail" aria-label="Show or hide every trail" />
              <h2 class="grow">Trails <span id="trail-count" class="muted"></span></h2>
              <button id="trail-expand-all" type="button">Expand all</button>
            </div>
            <input id="trail-search" type="search" placeholder="Filter by name"
                   aria-label="Filter trails by name" autocomplete="off" />
            <ul id="trail-list"></ul>
            <p id="trail-empty" class="hint">No GPX files in data/gpx.</p>
          </section>

          <section class="block">
            <label class="row">
              <input id="points-toggle" type="checkbox" />
              <span class="grow">Show 국가지점번호 points</span>
            </label>
            <p class="hint">Emergency location markers on 관악산 / 삼성산.</p>
          </section>

          <section class="block">
            <h2>Basemap</h2>
            <div id="basemap-options" class="options"></div>
          </section>
        </div>
      </aside>

      <div id="backdrop"></div>
      <button id="expand" type="button" title="Show panel" aria-label="Show panel">&#9776;</button>
      <button id="compass" type="button" hidden
              title="Show which way you are facing"
              aria-label="Show which way you are facing">&#10148;</button>
      <button id="locate" type="button" aria-pressed="false" data-state="off"
              title="Show your location" aria-label="Show your location">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          <circle cx="12" cy="12" r="2.5" fill="currentColor" />
          <path d="M12 1.5v3.5M12 19v3.5M1.5 12h3.5M19 12h3.5" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <line class="locate-slash" x1="4.5" y1="4.5" x2="19.5" y2="19.5"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <div id="map"></div>
      <div id="notices"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
